name: Morning alerts

# Every morning at 08:45 IST (after the 08:30 IST forecast issue time) the API sends
# WhatsApp / SMS alerts to verified subscribers whose street reaches their chosen level.
# Needs the repository secret MS_ADMIN_TOKEN (same value as on Render).
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live, or replay (for a demo)"
        default: live
      date:
        description: "replay date, e.g. 2024-07-25"
        default: ""

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch alerts
        env:
          TOKEN: ${{ secrets.MS_ADMIN_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
          DATE: ${{ github.event.inputs.date || '' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "MS_ADMIN_TOKEN not set; skipping"; exit 0; fi
          API=https://monsoon-sentinel-api.onrender.com
          curl -fsS -m 120 --retry 3 --retry-delay 30 "$API/api/health" > /dev/null   # wake the free instance
          if [ -n "$DATE" ]; then BODY="{\"mode\":\"$MODE\",\"date\":\"$DATE\"}"; else BODY="{\"mode\":\"$MODE\"}"; fi
          curl -fsS -m 300 -X POST "$API/api/alerts/dispatch" -H "Content-Type: application/json" \
               -H "X-Admin-Token: $TOKEN" -d "$BODY"

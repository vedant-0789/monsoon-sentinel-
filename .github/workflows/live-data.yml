name: Live weather snapshot

on:
  schedule:
    - cron: "10 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch Open-Meteo inputs
        run: |
          pip install -q "pandas==3.1.1" "pyarrow==26.0.1" "PyYAML==6.0.3" "requests==2.34.2" "numpy==2.5.4"
          python scripts/fetch_live.py snapshot

      - name: Publish to the live-data branch (single commit, no history growth)
        run: |
          cd snapshot
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
